name: Sync upstream OpenWorker

on:
  schedule:
    # Every Monday at 09:17 UTC (05:17 EDT / 04:17 EST).
    - cron: "17 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-upstream.yml]

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'dgregory3700/OpenWorker01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/andrewyng/openworker.git
          git fetch --no-tags upstream main

      - name: Merge upstream without overwriting fork changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Upstream conflicts with fork changes. Resolve the merge manually; main has not been changed."
            exit 1
          fi

      - name: Push synchronized main
        run: git push origin HEAD:main
