name: Sync upstream openworker

on:
  schedule:
    # Runs every day at 9:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/andrewyng/openworker.git || true
          git fetch upstream --tags

      - name: Mirror upstream main
        run: |
          git checkout main
          git reset --hard upstream/main

      - name: Push main and tags
        run: |
          git push origin main --force
          git push origin --tags --force
